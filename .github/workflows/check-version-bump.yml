name: Check version bump

on:
  pull_request:
    branches:
      - main

jobs:
  check-version:
    name: Ensure version has been bumped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare version with main
        run: |
          PR_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          BASE_VERSION=$(git show origin/main:.claude-plugin/plugin.json | jq -r '.version')

          echo "PR version:   $PR_VERSION"
          echo "Main version: $BASE_VERSION"

          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Version in .claude-plugin/plugin.json has not been updated. Please bump the version before merging to main."
            exit 1
          fi

          echo "Version has been bumped from $BASE_VERSION to $PR_VERSION."
